name: Production Verification

on:
  workflow_run:
    workflows: [ "Cloudflare Pages Build Verification" ]
    types: [ completed ]
  workflow_dispatch:

jobs:
  verify-production:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed production
        run: node scripts/verify-production.mjs

      - name: Run security dependency audit
        run: node .github/scripts/npm-audit-with-temporary-exception.mjs

  notify-indexnow:
    name: Notify IndexNow — changed published pages only
    needs: verify-production
    # Only successful production verification for our own main branch may notify engines.
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Notify changed static page URLs; never bulk-submit by default
        run: node scripts/indexnow-submit.mjs --changed-from=HEAD^
