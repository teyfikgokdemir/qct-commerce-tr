name: Advanced Security & Dependency Audit

on:
  pull_request:
    branches: [ main, master ]
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  security-audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Strict Dependency Install (npm ci)
        run: npm ci

      - name: Run Security Vulnerability Audit
        run: |
          echo "Running automated npm security audit for QCT Commerce TR..."
          node .github/scripts/npm-audit-with-temporary-exception.mjs

      - name: Run Build & Type Check
        run: |
          npm run build
