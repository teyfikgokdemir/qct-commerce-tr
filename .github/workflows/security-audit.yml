name: Advanced Security & Dependency Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Refresh security-patched lockfile
        if: github.event_name == 'pull_request'
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh patched dependency lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Strict Dependency Install (npm ci)
        run: npm ci

      - name: Run Security Vulnerability Audit
        run: |
          echo "Running automated npm security audit for QCT Commerce TR..."
          npm audit --audit-level=high

      - name: Run Build & Type Check
        run: |
          npm run build
