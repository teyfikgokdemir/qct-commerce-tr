name: Design Preview - Impeccable

on:
  push:
    branches: [design/impeccable-premium-polish-20261104]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and run existing content and multilingual audits
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture current production vs proposed local build
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/qct-preview.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4321/; then break; fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:4321/
          mkdir -p design-shots
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFileSync } from 'node:fs';
          const measurements = [];
          const browser = await chromium.launch({ headless: true });
          const targets = [
            { name: 'home-tr', path: '/' },
            { name: 'home-en', path: '/en/' },
            { name: 'services-tr', path: '/hizmetler/' },
          ];
          for (const [site, origin] of [
            ['production', 'https://qctcommerce.com'],
            ['proposal', 'http://127.0.0.1:4321'],
          ]) {
            for (const viewport of [
              { name: 'mobile', width: 390, height: 844 },
              { name: 'laptop', width: 1200, height: 900 },
              { name: 'desktop', width: 1440, height: 900 },
            ]) {
              const context = await browser.newContext({ viewport, deviceScaleFactor: 1, reducedMotion: 'reduce' });
              const page = await context.newPage();
              for (const target of targets) {
                await page.goto(origin + target.path, { waitUntil: 'networkidle', timeout: 60000 });
                await page.screenshot({ path: `design-shots/${site}-${target.name}-${viewport.name}.png`, fullPage: false, animations: 'disabled' });
                const focus = target.name.startsWith('home') ? page.locator('.qct-calculator') : page.locator('.qct-svc-grid').first();
                if (await focus.count()) {
                  await focus.scrollIntoViewIfNeeded();
                  await page.screenshot({ path: `design-shots/${site}-${target.name}-${viewport.name}-detail.png`, fullPage: false, animations: 'disabled' });
                }
                const measure = await page.evaluate(() => ({
                  horizontalOverflow: document.documentElement.scrollWidth > innerWidth + 1,
                  viewport: innerWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  title: document.title,
                  sectionWidths: [...(document.querySelector('[data-qct-v2]')?.children || [])]
                    .map((el) => ({ selector: el.tagName.toLowerCase() + (el.className ? '.' + String(el.className).replace(/\\s+/g, '.') : ''), scrollWidth: el.scrollWidth, clientWidth: el.clientWidth, right: Math.round(el.getBoundingClientRect().right), overflowX: getComputedStyle(el).overflowX }))
                    .filter((x) => x.scrollWidth > x.clientWidth + 2 || x.right > innerWidth + 2),
                  widthDomains: ['html', 'body', '.site-main', '[data-qct-v2]', '.qct-marquee', '.qct-image-story', '.qct-image-story .qct-section-head', '.qct-image-story .qct-section-head > p:not(.qct-section-label)', '.site-footer', '.site-header']
                    .map((selector) => {
                      const el = document.querySelector(selector);
                      if (!el) return null;
                      const box = el.getBoundingClientRect();
                      return { selector, scrollWidth: el.scrollWidth, clientWidth: el.clientWidth, rectRight: Math.round(box.right), overflowX: getComputedStyle(el).overflowX, whiteSpace: getComputedStyle(el).whiteSpace };
                    }).filter(Boolean),
                  editorial: (() => {
                    const node = document.querySelector('.qct-image-story .qct-section-head h2');
                    if (!node) return null;
                    const r = node.getBoundingClientRect();
                    return { right: Math.round(r.right), width: Math.round(r.width), fontSize: getComputedStyle(node).fontSize, whiteSpace: getComputedStyle(node).whiteSpace };
                  })(),
                  offenders: [...document.querySelectorAll('body *')]
                    .filter((element) => {
                      const r = element.getBoundingClientRect();
                      const style = getComputedStyle(element);
                      if (style.display === 'none' || r.width === 0 || !(r.right > innerWidth + 2 || r.left < -2)) return false;
                      for (let p = element.parentElement; p; p = p.parentElement) {
                        if (/hidden|clip|auto|scroll/.test(getComputedStyle(p).overflowX)) return false;
                      }
                      return true;
                    })
                    .sort((a, b) => b.getBoundingClientRect().right - a.getBoundingClientRect().right)
                    .slice(0, 16).map((element) => ({
                      tag: element.tagName.toLowerCase(),
                      className: typeof element.className === 'string' ? element.className.slice(0, 90) : '',
                      right: Math.round(element.getBoundingClientRect().right),
                      left: Math.round(element.getBoundingClientRect().left),
                    })),
                }));
                measurements.push({ site, page: target.name, viewport: viewport.name, ...measure });
                console.log(site, target.name, viewport.name, JSON.stringify(measure));
              }
              await context.close();
            }
          }
          await browser.close();
          writeFileSync('design-shots/measurements.json', JSON.stringify(measurements, null, 2));
          const regressions = [];
          for (const p of measurements.filter(x => x.site === 'proposal')) {
            const baseline = measurements.find(x => x.site === 'production' && x.page === p.page && x.viewport === p.viewport);
            if (p.horizontalOverflow && (!baseline?.horizontalOverflow || p.scrollWidth > baseline.scrollWidth + 2)) {
              regressions.push(`${p.page}/${p.viewport}: proposal ${p.scrollWidth}px vs baseline ${baseline?.scrollWidth}px`);
            }
          }
          if (regressions.length) throw new Error('New or worsened horizontal overflow: ' + regressions.join('; '));
          NODE
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qct-premium-design-shots
          path: design-shots/
          retention-days: 7
          if-no-files-found: warn
